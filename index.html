
<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Mahii ❤️</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;

      cursor: pointer;
    }
  </style>

<body>
  <main>
    <h1>Happy Birthday, Mahii! 🎂❤️</h1>
    <p>A special birthday surprise for you. You deserve all the love and happiness in the world! 🌹</p>
    <button onclick="alert('Your special surprise is coming soon! ❤️')">
      Open Your Surprise 💌
    </button>

</html>
