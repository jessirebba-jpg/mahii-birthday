
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffeef3">
  <title>Happiest Birthday Mahiii 🫠❤️‍🩹</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --pink: #d6336c;
      --dark-pink: #a92755;
      --text: #754453;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      overflow-x: hidden;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--text);
      background: linear-gradient(
        135deg,
        #fffdf7,
        #ffeef3,
        #f7c3d0,
        #fff1e9
      );
      background-size: 300% 300%;
      animation: backgroundFlow 12s ease infinite;
    }

    @keyframes backgroundFlow {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .sparkle-layer,
    .heart-layer {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .sparkle-layer {
      z-index: 0;
    }

    .heart-layer {
      z-index: 2;
    }

    .sparkle {
      position: absolute;
      top: -30px;
      left: var(--x);
      color: white;
      font-size: var(--size);
      opacity: 0.8;
      animation: sparkleFall var(--duration) linear infinite;
      animation-delay: var(--delay);
    }

    @keyframes sparkleFall {
      from {
        transform: translateY(-30px) rotate(0deg);
        opacity: 0;
      }
      15% { opacity: 0.9; }
      to {
        transform: translateY(110vh) rotate(240deg);
        opacity: 0;
      }
    }

    .heart {
      position: absolute;
      left: var(--x);
      bottom: -50px;
      font-size: var(--size);
      color: var(--color);
      opacity: 0.75;
      animation: floatUp var(--duration) linear infinite;
      animation-delay: var(--delay);
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg) scale(0.7);
        opacity: 0;
      }
      15% { opacity: 0.8; }
      80% { opacity: 0.7; }
      100% {
        transform: translateY(-115vh) rotate(35deg) scale(1.2);
        opacity: 0;
      }
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 14px;
    }

    .card {
      width: min(100%, 520px);
      padding: 32px 22px 28px;
      text-align: center;
      border: 2px solid rgba(255,255,255,0.9);
      border-radius: 34px;
      background: rgba(255, 251, 249, 0.86);
      box-shadow:
        0 22px 70px rgba(165, 68, 100, 0.16),
        inset 0 0 30px rgba(255,255,255,0.8);
      backdrop-filter: blur(8px);
      animation: cardAppear 1s ease-out both;
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(28px) scale(0.94);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .eyebrow {
      margin: 0 0 15px;
      color: #bd6884;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 8vw, 47px);
      line-height: 1.18;
      font-weight: normal;
      color: #754453;
    }

    h1 span {
      display: block;
      margin-top: 5px;
      color: var(--pink);
      font-style: italic;
    }

    .subtitle {
      margin: 15px 0 0;
      color: #a87685;
      font-size: clamp(14px, 4vw, 17px);
      line-height: 1.7;
    }

    .gift-scene {
      position: relative;
      width: 230px;
      height: 205px;
      max-width: 80%;
      margin: 18px auto 8px;
      display: grid;
      place-items: center;
    }

    .gift {
      position: relative;
      width: 125px;
      height: 112px;
      margin-top: 45px;
      border-radius: 8px 8px 16px 16px;
      background: linear-gradient(135deg, #ff9db9, #e95183);
      box-shadow: 0 14px 0 #c94472, 0 22px 30px #d65c8330;
      animation: giftBounce 2.8s ease-in-out infinite;
    }

    .gift::before {
      content: "";
      position: absolute;
      left: -10px;
      top: -13px;
      width: 145px;
      height: 23px;
      border-radius: 8px;
      background: linear-gradient(135deg, #ffc0d1, #f0789c);
      box-shadow: 0 4px 8px #bd466322;
    }

    .ribbon {
      position: absolute;
      left: 51px;
      top: -12px;
      width: 24px;
      height: 124px;
      background: linear-gradient(90deg, #fff0b8, #ffe39a);
      border-radius: 5px;
      z-index: 1;
    }

    .bow {
      position: absolute;
      left: 50%;
      top: -37px;
      z-index: 2;
      width: 28px;
      height: 24px;
      border: 8px solid #ffe8a4;
      border-radius: 80% 20% 80% 20%;
      transform: translateX(-100%) rotate(25deg);
    }

    .bow::after {
      content: "";
      position: absolute;
      left: 15px;
      top: -8px;
      width: 28px;
      height: 24px;
      border: 8px solid #ffe8a4;
      border-radius: 20% 80% 20% 80%;
      transform: rotate(-50deg);
    }

    .gift-heart {
      position: absolute;
      z-index: 3;
      top: 38px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 27px;
      color: white;
      animation: heartBeat 1.5s ease-in-out infinite;
    }

    @keyframes giftBounce {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }

    @keyframes heartBeat {
      0%, 100% { scale: 1; }
      50% { scale: 1.18; }
    }

    .orbit {
      position: absolute;
      inset: 10px;
      border: 1px dashed #ed9ab4;
      border-radius: 50%;
      animation: orbitSpin 18s linear infinite;
    }

    .orbit::before,
    .orbit::after {
      content: "✦";
      position: absolute;
      color: #df6890;
      font-size: 20px;
    }

    .orbit::before {
      top: 5px;
      left: 28px;
    }

    .orbit::after {
      right: 15px;
      bottom: 20px;
    }

    @keyframes orbitSpin {
      to { transform: rotate(360deg); }
    }

    .prompt {
      margin: 12px 0 20px;
      font-size: clamp(17px, 4.5vw, 21px);
      line-height: 1.5;
      font-weight: bold;
    }

    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 13px;
    }

    button {
      min-width: 145px;
      padding: 14px 19px;
      border: 0;
      border-radius: 18px;
      font: bold 15px Georgia, serif;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:active {
      transform: scale(0.95);
    }

    .yes {
      color: white;
      background: linear-gradient(135deg, #ed5787, #c92860);
      box-shadow: 0 6px 0 #a9204e, 0 12px 22px #c9286030;
    }

    .yes:hover {
      box-shadow: 0 8px 0 #a9204e, 0 15px 25px #c9286040;
      transform: translateY(-2px);
    }

    .no {
      color: #638a7a;
      background: #e7f9ef;
      border: 1px solid #b7e4d0;
      box-shadow: 0 6px 0 #c7e8d8;
    }

    .hint {
      min-height: 23px;
      margin: 20px 0 0;
      font-size: 14px;
      line-height: 1.6;
      color: #ad7585;
    }

    .footer {
      margin: 25px 0 0;
      color: #bd8795;
      font-size: 11px;
      letter-spacing: 2px;
    }

    .burst {
      position: fixed;
      z-index: 10;
      pointer-events: none;
      font-size: 23px;
      animation: burstAway 900ms ease-out forwards;
    }

    @keyframes burstAway {
      to {
        transform: translate(var(--dx), var(--dy)) rotate(180deg) scale(0.2);
        opacity: 0;
      }
    }

    @media (max-height: 720px) {
      main { padding: 12px; }
      .card { padding: 22px 18px; }
      .gift-scene { height: 160px; transform: scale(0.85); margin: 5px auto; }
      .subtitle { margin-top: 10px; }
      .prompt { margin: 8px 0 15px; }
      .footer { margin-top: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div class="sparkle-layer" id="sparkles" aria-hidden="true"></div>
  <div class="heart-layer" id="hearts" aria-hidden="true"></div>

  <main>
    <section class="card">
      <p class="eyebrow">✦ A little surprise made with love ✦</p>

      <h1>
        Happiest Birthday
        <span>mahiii🫠❤️‍🩹</span>
      </h1>

      <div class="gift-scene" aria-label="A floating pink birthday gift">
        <div class="orbit"></div>
        <div class="gift">
          <div class="ribbon"></div>
          <div class="bow"></div>
          <span class="gift-heart">♥</span>
        </div>
      </div>

      <p class="prompt" id="prompt">
        Ready for your little birthday surprise, Mahiii? 🎀
      </p>

      <div class="buttons">
        <button class="yes" id="yesButton" type="button">
          YES, SHOW ME ♡
        </button>

        <button class="no" id="noButton" type="button">
          NOT YET 🌷
        </button>
      </div>

      <p class="hint" id="hint" aria-live="polite">
        Something special is waiting just for you ✨
      </p>

      <p class="footer">MADE WITH LOVE, JUST FOR YOU ♡</p>
    </section>
  </main>

  <script>
    // Floating hearts and sparkles: generated locally, no external library.
    const heartLayer = document.getElementById("hearts");
    const sparkleLayer = document.getElementById("sparkles");

    function createFloatingItems(container, symbols, count, className) {
      for (let i = 0; i < count; i++) {
        const item = document.createElement("span");
        item.className = className;
        item.textContent = symbols[
          Math.floor(Math.random() * symbols.length)
        ];

        item.style.setProperty("--x", Math.random() * 100 + "%");
        item.style.setProperty("--size", (12 + Math.random() * 22) + "px");
        item.style.setProperty("--duration", (7 + Math.random() * 10) + "s");
        item.style.setProperty("--delay", (-Math.random() * 16) + "s");

        if (className === "heart") {
          const colors = ["#e8799b", "#d95d86", "#f3a8bf", "#c94e79"];
          item.style.setProperty(
            "--color",
            colors[Math.floor(Math.random() * colors.length)]
          );
        }

        container.appendChild(item);
      }
    }

    createFloatingItems(heartLayer, ["♥", "♡", "❤", "💗"], 20, "heart");
    createFloatingItems(sparkleLayer, ["✦", "✧", "⋆", "·"], 24, "sparkle");

    // A little message when "Not yet" is clicked.
    const noMessages = [
      "Hehe, I'll wait for you, Mahiii 🥹💗",
      "The little surprise isn't going anywhere 🎁",
      "One tiny click whenever you're ready 🌷",
      "Sending you extra hugs until then 🫂💕"
    ];

    let noCount = 0;

    document.getElementById("noButton").addEventListener("click", function () {
      document.getElementById("hint").textContent =
        noMessages[noCount % noMessages.length];
      noCount++;
    });

    // Tiny heart burst on the YES button.
    function heartBurst() {
      const symbols = ["♥", "♡", "✦", "💗"];
      const button = document.getElementById("yesButton");
      const rect = button.getBoundingClientRect();

      for (let i = 0; i < 14; i++) {
        const particle = document.createElement("span");
        particle.className = "burst";
        particle.textContent = symbols[i % symbols.length];
        particle.style.left = (rect.left + rect.width / 2) + "px";
        particle.style.top = (rect.top + rect.height / 2) + "px";

        const angle = (Math.PI * 2 * i) / 14;
        const distance = 60 + Math.random() * 75;

        particle.style.setProperty("--dx", Math.cos(angle) * distance + "px");
        particle.style.setProperty("--dy", Math.sin(angle) * distance + "px");

        document.body.appendChild(particle);
        setTimeout(() => particle.remove(), 1000);
      }
    }

    // YES opens Module 2 in the same GitHub Pages repository.
    document.getElementById("yesButton").addEventListener("click", function () {
      heartBurst();
      this.disabled = true;
      this.textContent = "OPENING YOUR SURPRISE… 💗";

      setTimeout(function () {
        window.location.href = "module2.html";
      }, 450);
    });
  </script>
</body>
</html>

  <script>
    // NOT YET button
    const notYetButton = document.getElementById("notYetButton");
    const response = document.getElementById("response");

    let messageIndex = 0;

    const messages = [
      "Hehe 🙈 Take your time, Mahii! Your surprise is waiting 💗",
      "A little curious, aren't we? 🤭💕",
      "Okayyy, but your surprise is getting shy! 🎁🥹",
      "Whenever you're ready, press YES, SHOW ME! 🩷"
    ];

    notYetButton.addEventListener("click", function () {
      response.textContent = messages[messageIndex];
      messageIndex = (messageIndex + 1) % messages.length;
    });

    // Floating hearts and sparkles
    const decorations = ["💗", "💕", "✨", "♡", "🌸", "💖"];

    function createFloatingDecoration() {
      const item = document.createElement("span");
      item.className = "float";
      item.textContent =
        decorations[Math.floor(Math.random() * decorations.length)];

      item.style.left = Math.random() * 100 + "vw";
      item.style.fontSize = (14 + Math.random() * 18) + "px";
      item.style.animationDuration = (7 + Math.random() * 7) + "s";

      document.body.appendChild(item);

      item.addEventListener("animationend", function () {
        item.remove();
      });
    }

    for (let i = 0; i < 12; i++) {
      setTimeout(createFloatingDecoration, i * 350);
    }

    setInterval(createFloatingDecoration, 850);
document.addEventListener("DOMContentLoaded", function () {
  const currentFile = window.location.pathname
    .split("/")
    .pop()
    .toLowerCase();

  const moduleFiles = [
    "index.html",
    "module2.html",
    "module3.html",
    "module4.html",
    "module5.html",
    "module6.html"
  ];

  const currentIndex = moduleFiles.indexOf(currentFile);
  if (currentIndex === -1) return;

  // Connect Continue / Next buttons to the next module.
  document.querySelectorAll("button, a").forEach(function (element) {
    const label = (
      element.innerText ||
      element.textContent ||
      element.getAttribute("aria-label") ||
      ""
    ).trim().toLowerCase();

    if (
      label.includes("continue") ||
      label === "next" ||
      label.includes("yes show me")
    ) {
      element.addEventListener("click", function (event) {
        event.preventDefault();

        const nextIndex = currentIndex + 1;
        if (nextIndex < moduleFiles.length) {
          window.location.href = moduleFiles[nextIndex];
        }
      });
    }
  });
});
</script>
</body>
</html>
